name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest
        # Settings requires DATABASE_URL and SECRET_KEY with no defaults and
        # .env is gitignored, so CI provides dummy values. The test suite
        # itself runs on in-memory SQLite (see app/tests/conftest.py); these
        # are fixtures, not secrets.
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
          SECRET_KEY: ci-only-dummy-secret-key-0123456789abcdef

      - name: Print canonical layout benchmark table
        run: |
          python scripts/benchmark_mvp_engine.py
          python scripts/benchmark_hierarchical_archetypes.py
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
          SECRET_KEY: ci-only-dummy-secret-key-0123456789abcdef

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build
